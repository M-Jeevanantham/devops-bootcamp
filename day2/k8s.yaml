# Day 2: run the image on Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-bootcamp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-bootcamp
  template:
    metadata:
      labels:
        app: devops-bootcamp
    spec:
      containers:
        - name: web
          image: devops-bootcamp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-bootcamp
spec:
  type: NodePort
  selector:
    app: devops-bootcamp
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
